name: Build Geode Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Geode CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/geode-sdk/cli/main/install.sh | bash

      - name: Build
        run: geode build -p android64

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: DeathParticlesOff
          path: build/*.geode
