name: Build Geode Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Geode SDK
        uses: geode-sdk/action@main

      - name: Build
        run: geode build -p android64

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: DeathParticlesOff
          path: build/*.geode
